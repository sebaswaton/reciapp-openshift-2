server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: deja que react-router-dom maneje el ruteo
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets versionados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
